    follow-range: 24
    bite-chance: 0.30
    memory-seconds: 6
    siege-power: 3
    points: 10
    appearances: [citizen, citizen_tall, citizen_short, child, elder, nurse, worker, security, villager, farmer, drifter, engineer, scientist, guard, explorer]
    guaranteed-loot:
      - {item: apocalypse:scrap, weight: 50}
      - {item: apocalypse:cloth, weight: 50}
    bonus-loot:
