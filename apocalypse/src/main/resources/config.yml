# DuckCatApocalypse — réglages du scénario Ground Zero.
# Durées en secondes sauf mention contraire. Une valeur invalide est refusée avec un message précis :
# au démarrage, les règles de référence s'appliquent ; /apocalypse admin reload garde la dernière
# configuration valide. Les nouvelles durées valent pour les nouveaux événements : une infection ou un sac
# en cours garde l'échéance calculée à sa création.
# Version 2 : ville générée, fouille, infectés variés. Un ancien fichier v1 est mis de côté (config.v1.yml).
config-version: 2

scenario:
  id: ground_zero
  # Monde dédié créé par /apocalypse admin world create (jamais un monde existant).
  world: ground_zero
  # Côté de la bordure. La ville (1 200 blocs) occupe le centre ; campagne, fermes, barrages et
  # laboratoire NEXUS l'entourent.
  border-size: 3072
  difficulty: NORMAL

refuge:
  center-x: 0
  center-z: 0
  # Demi-côté du refuge carré, murs compris (la place centrale fait 37 blocs de côté).
  radius: 12

infection:
  duration-seconds: 60
  repeated-bites-reset-timer: false
  antidote-use-seconds: 2.0
  # Le mouvement n'interrompt pas l'administration ; ces réglages gardent une chance de fuite.
  antidote-allow-sprint: true
  antidote-speed-multiplier: 1.0

death:
  bag-lifetime-seconds: 300
  bag-access-radius: 4.5

respawn:
  protection-seconds: 30

loot:
  contribution-window-seconds: 30
  # Probabilité d'un bonus en plus de l'objet garanti, pour chaque élimination admissible.
  bonus-roll-chance: 0.12

search:
  # Un coffre ou tonneau de fouille vidé se réapprovisionne après ce temps de scénario actif, et seulement
  # quand plus personne n'est dans les parages (le tronçon a été déchargé). Un conteneur qui contient encore
  # des objets n'est jamais rempli par-dessus. On ne peut rien y déposer.
  refill-minutes: 30

spawning:
  enabled: true
  interval-seconds: 3
  global-cap: 60
  min-distance: 20
  max-distance: 40
  despawn-distance: 72
  # Infectés en plus autour de chaque survivant pendant la nuit.
  night-bonus: 2
  # Part des apparitions dans les bâtiments abandonnés sombres (rez-de-chaussée), jamais dans un lieu éclairé.
  indoor-chance: 0.25

# Plafond local autour de chaque survivant et mélange des archétypes (poids relatifs) par secteur.
sectors:
  starter:
    local-cap: 3
    mix: {walker: 80, pursuer: 20}
  residential:
    local-cap: 4
    mix: {walker: 55, pursuer: 25, runner: 12, howler: 5, breaker: 3}
  downtown:
    local-cap: 6
    mix: {walker: 40, pursuer: 25, runner: 18, howler: 10, breaker: 7}
  industrial:
    local-cap: 5
    mix: {walker: 35, pursuer: 20, runner: 15, howler: 5, breaker: 25}
  medical:
    local-cap: 6
    mix: {walker: 35, pursuer: 28, runner: 15, howler: 15, breaker: 5, abomination: 2}
  outskirts:
    local-cap: 3
    mix: {walker: 60, pursuer: 25, runner: 10, howler: 5}
  countryside:
    local-cap: 2
    mix: {walker: 60, pursuer: 25, runner: 10, breaker: 5}
  lab:
    local-cap: 7
    mix: {walker: 20, pursuer: 25, runner: 25, howler: 10, breaker: 14, abomination: 6}

# Archétypes : comportement et capacités. L'apparence ne change jamais les statistiques.
# speed est une valeur d'attribut Minecraft (zombie vanilla : 0.23), pas des blocs par seconde.
# bite-chance : probabilité qu'un coup reçu soit une morsure (environ 1 sur 3 en moyenne).
archetypes:
  walker:
    name: Errant
    health: 20
    damage: 3.0
    speed: 0.17
    speed-variation: 0.015
    follow-range: 24
    bite-chance: 0.30
    appearances: [citizen, citizen_tall, citizen_short, child, elder, nurse, worker, security, villager, farmer, drifter]
    guaranteed-loot:
      - {item: apocalypse:scrap, weight: 50}
      - {item: apocalypse:cloth, weight: 50}
    bonus-loot:
      - {item: minecraft:bread, weight: 40}
      - {item: apocalypse:bandage, weight: 25}
      - {item: apocalypse:tape, weight: 15}
      - {item: apocalypse:alcohol, weight: 10}
      - {item: apocalypse:casings, weight: 8, amount: 2}
      - {item: apocalypse:antidote, weight: 2}
  pursuer:
    name: Poursuivant
    health: 20
    damage: 3.5
    speed: 0.24
    speed-variation: 0.01
    follow-range: 32
    bite-chance: 0.33
    appearances: [citizen, citizen_tall, security, paramedic, worker, villager, drifter]
    abilities:
      # Durée pendant laquelle il fouille la dernière position connue après avoir perdu sa cible.
      memory-seconds: 12
    guaranteed-loot:
      - {item: apocalypse:cloth, weight: 50}
      - {item: apocalypse:scrap, weight: 35}
      - {item: apocalypse:tape, weight: 15}
    bonus-loot:
      - {item: minecraft:cooked_beef, weight: 40}
      - {item: apocalypse:bandage, weight: 25}
      - {item: apocalypse:spring, weight: 15}
      - {item: apocalypse:casings, weight: 15, amount: 3}
      - {item: apocalypse:antidote, weight: 3}
  runner:
    name: Sprinteur
    health: 16
    damage: 3.0
    speed: 0.21
    speed-variation: 0.01
    follow-range: 32
    bite-chance: 0.36
    appearances: [runner, citizen_short, child]
    abilities:
      # Rafale annoncée par un cri bref, puis récupération essoufflée.
      sprint-speed: 0.34
      sprint-seconds: 2.5
      sprint-range: 14
      recovery-seconds: 3
      recovery-speed: 0.12
      cooldown-seconds: 8
    guaranteed-loot:
      - {item: apocalypse:cloth, weight: 60}
      - {item: apocalypse:scrap, weight: 40}
    bonus-loot:
      - {item: minecraft:apple, weight: 40}
      - {item: apocalypse:bandage, weight: 30}
      - {item: apocalypse:spring, weight: 20}
      - {item: apocalypse:syringe, weight: 8}
      - {item: apocalypse:antidote, weight: 2}
  howler:
    name: Hurleur
    health: 18
    damage: 2.5
    speed: 0.19
    follow-range: 32
    bite-chance: 0.25
    appearances: [howler]
    abilities:
      # Cri préparé (interrompu par un coup) qui attire les infectés proches vers le hurleur.
      charge-seconds: 2
      radius: 32
      cooldown-seconds: 40
      # Renforts d'errants, toujours dans la limite globale ; jamais de hurleur.
      reinforcements: 2
    guaranteed-loot:
      - {item: apocalypse:cloth, weight: 50}
      - {item: apocalypse:alcohol, weight: 25}
      - {item: apocalypse:syringe, weight: 25}
    bonus-loot:
      - {item: apocalypse:bandage, weight: 45}
      - {item: apocalypse:inhibitor, weight: 30}
      - {item: apocalypse:serum, weight: 15}
      - {item: apocalypse:antidote, weight: 10}
  breaker:
    name: Briseur
    health: 60
    damage: 6.0
    speed: 0.15
    follow-range: 24
    bite-chance: 0.30
    armor: 6
    knockback-resistance: 0.8
    appearances: [heavy_worker, heavy_security]
    guaranteed-loot:
      - {item: apocalypse:scrap, weight: 60, amount: 2}
      - {item: apocalypse:tape, weight: 40}
    bonus-loot:
      - {item: apocalypse:spring, weight: 35}
      - {item: apocalypse:gun_parts, weight: 30}
      - {item: apocalypse:propellant, weight: 25}
      - {item: apocalypse:antidote, weight: 10}
  abomination:
    name: Abomination
    health: 200
    damage: 9.0
    speed: 0.2
    follow-range: 32
    bite-chance: 0.5
    armor: 4
    knockback-resistance: 1.0
    scale: 1.6
    max-alive: 1
    appearances: [abomination]
    abilities:
      # Frappe au sol annoncée : élan visible, dégâts de zone (pas une morsure), longue récupération.
      slam-wind-up-seconds: 1.5
      slam-radius: 4
      slam-damage: 10
      slam-recovery-seconds: 3
      slam-cooldown-seconds: 10
    guaranteed-loot:
      - {item: apocalypse:serum, weight: 50}
      - {item: apocalypse:inhibitor, weight: 50}
    bonus-loot:
      - {item: apocalypse:antidote, weight: 50}
      - {item: apocalypse:gun_parts, weight: 30, amount: 2}
      - {item: apocalypse:syringe, weight: 20, amount: 2}

