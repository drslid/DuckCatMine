survival-content-version: 8
# DuckCatApocalypse — réglages du scénario Ground Zero.
# Durées en secondes sauf mention contraire. Une valeur invalide est refusée avec un message précis :
# au démarrage, les règles de référence s'appliquent ; /apocalypse admin reload garde la dernière
# configuration valide. Les nouvelles durées valent pour les nouveaux événements : une infection ou un sac
# en cours garde l'échéance calculée à sa création.
# Version 2 : ville générée, fouille, infectés variés. Un ancien fichier v1 est mis de côté (config.v1.yml).
config-version: 2

scenario:
  id: ground_zero
  # Monde dédié créé par /apocalypse admin world create (jamais un monde existant).
  world: ground_zero
  # Côté de la bordure. La ville (1 200 blocs) occupe le centre ; campagne, fermes, barrages et
  # laboratoire NEXUS l'entourent.
  border-size: 3072
  difficulty: NORMAL

refuge:
  center-x: 0
  center-z: 0
  # Demi-côté du refuge carré, murs compris (la place centrale fait 37 blocs de côté).
  radius: 12

infection:
  duration-seconds: 60
  repeated-bites-reset-timer: false
  antidote-use-seconds: 2.0
  # Le mouvement n'interrompt pas l'administration ; ces réglages gardent une chance de fuite.
  antidote-allow-sprint: true
  antidote-speed-multiplier: 1.0
  # Multiplie la chance de morsure de chaque archétype (1 = valeurs des archétypes, 0 = plus aucune morsure).
  bite-multiplier: 1.0

death:
  bag-lifetime-seconds: 300
  bag-access-radius: 4.5

respawn:
  protection-seconds: 30
  # Après une mort, réapparition près du dernier lit utilisé (clic droit sur un lit de Ground Zero), s'il existe encore.
  bed: true

loot:
  contribution-window-seconds: 30
  # Probabilité d'un bonus en plus de l'objet garanti, pour chaque élimination admissible.
  bonus-roll-chance: 0.12
  # Multiplie la présence des antidotes, sérums et inhibiteurs dans les lieux fouillés (pharmacies, hôpital, laboratoire...).
  medical-boost: 3

search:
  # Un coffre ou tonneau de fouille vidé se réapprovisionne après ce temps de scénario actif, et seulement
  # quand plus personne n'est dans les parages (le tronçon a été déchargé). Un conteneur qui contient encore
  # des objets n'est jamais rempli par-dessus. Les dépôts et la casse restent possibles.
  refill-minutes: 30

spawning:
  enabled: true
  interval-seconds: 3
  global-cap: 200
  # Distance horizontale à TOUS les joueurs, vérifiée juste avant chaque apparition.
  min-distance: 110
  max-distance: 190
  despawn-distance: 200
  # Infectés en plus autour de chaque survivant pendant la nuit.
  night-bonus: 2
  # Rencontres dans certains bâtiments abandonnés. Jamais dans les pièces visitées, ni dans les bases protégées.
  indoor-chance: 0.3
  # Densité : multiplie le plafond local de chaque secteur (1 = valeurs des secteurs, 2 = deux fois plus d'infectés).
  density: 3.5
  # Nouveaux infectés au plus par survivant et par passage, tant que le plafond local n'est pas atteint.
  per-tick: 4

# Plafond local autour de chaque survivant et mélange des archétypes (poids relatifs) par secteur.
sectors:
  starter:
    local-cap: 3
    mix: {walker: 80, pursuer: 20}
  residential:
    local-cap: 4
    mix: {walker: 50, pursuer: 18, runner: 8, howler: 4, breaker: 3, spitter: 4, jumper: 4, crawler: 5, stalker: 2, bloated: 2, smiler: 2}
  downtown:
    local-cap: 6
    mix: {walker: 35, pursuer: 20, runner: 10, howler: 7, breaker: 7, spitter: 6, jumper: 5, crawler: 4, stalker: 3, bloated: 3, smiler: 2}
  industrial:
    local-cap: 5
    mix: {walker: 30, pursuer: 15, runner: 10, howler: 4, breaker: 22, spitter: 5, jumper: 4, crawler: 4, stalker: 2, bloated: 4, smiler: 1}
  medical:
    local-cap: 6
    mix: {walker: 28, pursuer: 20, runner: 10, howler: 10, breaker: 5, abomination: 2, spitter: 8, jumper: 4, crawler: 5, stalker: 4, bloated: 4, smiler: 2}
  outskirts:
    local-cap: 3
    mix: {walker: 55, pursuer: 20, runner: 8, howler: 4, spitter: 3, jumper: 4, crawler: 3, stalker: 2, bloated: 1, smiler: 2}
  countryside:
    local-cap: 2
    mix: {walker: 55, pursuer: 20, runner: 8, breaker: 5, spitter: 2, jumper: 4, crawler: 3, stalker: 2, bloated: 1, smiler: 1}
  lab:
    local-cap: 7
    mix: {walker: 15, pursuer: 15, runner: 15, howler: 8, breaker: 12, abomination: 5, spitter: 9, jumper: 7, crawler: 4, stalker: 5, bloated: 5, smiler: 3}

# Archétypes : comportement et capacités. L'apparence ne change jamais les statistiques.
# speed est une valeur d'attribut Minecraft (zombie vanilla : 0.23), pas des blocs par seconde.
# bite-chance : probabilité qu'un coup reçu soit une morsure (environ 1 sur 3 en moyenne).
archetypes:
  walker:
    abilities:
      spawn-weight: 1
    max-alive: 0
