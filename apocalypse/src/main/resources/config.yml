clock:
  checkpoint-seconds: 5

# Largage : chaque nouvelle vie (première entrée ou après une mort) commence n'importe où sur la carte, jamais dans
# le refuge ni près du complexe NEXUS. city-chance = part des largages en ville (le reste : campagne).
spawn:
  city-chance: 0.65
  refuge-margin: 24
  border-margin: 48

# Provisions de départ tirées au hasard : uniquement des objets courants (les objets rares sont refusés ici).
# Avec un peu de chance, de quoi fabriquer une première arme. Rien si la vie précédente a duré moins de
# min-previous-life-minutes (mourir exprès ne sert pas à cumuler des provisions).
start-kit:
  rolls-min: 2
  rolls-max: 4
  loot:
    - {item: minecraft:bread, weight: 20, amount: 2}
    - {item: minecraft:apple, weight: 14, amount: 2}
    - {item: minecraft:carrot, weight: 10, amount: 3}
    - {item: minecraft:cookie, weight: 8, amount: 3}
    - {item: minecraft:dried_kelp, weight: 8, amount: 4}
    - {item: minecraft:torch, weight: 14, amount: 3}
    - {item: apocalypse:cloth, weight: 10}
    - {item: apocalypse:bandage, weight: 5}
    - {item: minecraft:stick, weight: 8, amount: 2}
    - {item: minecraft:string, weight: 5, amount: 2}
    - {item: apocalypse:note, weight: 4}
  weapon-chance: 0.4
  weapon-kits:
    club:
      - {item: minecraft:oak_planks, amount: 2}
      - {item: apocalypse:cloth, amount: 1}
    blade:
      - {item: apocalypse:scrap, amount: 2}
      - {item: apocalypse:tape, amount: 1}
    spear:
      - {item: minecraft:stick, amount: 2}
      - {item: apocalypse:scrap, amount: 1}
      - {item: apocalypse:cloth, amount: 1}
  min-previous-life-minutes: 10

# Fabrication : clic droit sur un établi (workbench), un atelier mécanique (workshop) ou un poste médical (medical).
# Ingrédients : apocalypse:<objet>, minecraft:<objet> ou #planks, #logs, #wool (toutes les essences).
# noise : bruit fait en fabriquant (none, low, medium, high), qui peut attirer les infectés.
recipes:
  club:
    station: workbench
    result: {item: apocalypse:club}
    ingredients: {"#planks": 2, "apocalypse:cloth": 1}
    usage: Première arme bon marché, portée courte.
  blade:
    station: workbench
    result: {item: apocalypse:blade}
    ingredients: {"apocalypse:scrap": 2, "apocalypse:tape": 1}
    usage: Arme rapide mais fragile.
  spear:
    station: workbench
    result: {item: apocalypse:spear}
    ingredients: {"minecraft:stick": 2, "apocalypse:scrap": 1, "apocalypse:cloth": 1}
    usage: Frappe de plus loin, cadence réduite.
  heavy_club:
    station: workbench
    result: {item: apocalypse:heavy_club}
    ingredients: {"apocalypse:club": 1, "apocalypse:scrap": 3, "apocalypse:tape": 1}
    noise: low
    usage: Plus solide, frappe fort et repousse.
  workshop:
    station: workbench
    result: {item: apocalypse:workshop}
    ingredients: {"minecraft:crafting_table": 1, "apocalypse:scrap": 4, "#planks": 2}
    noise: low
    usage: Fabrication et réparation avancées (pistolet, munitions, barricades).
  medical_station:
    station: workbench
    result: {item: apocalypse:medical_station}
    ingredients: {"minecraft:crafting_table": 1, "apocalypse:scrap": 2, "apocalypse:cloth": 2}
    usage: Préparation des bandages et de l'antidote.
  pistol:
    station: workshop
    result: {item: apocalypse:pistol}
    ingredients: {"apocalypse:gun_parts": 2, "apocalypse:scrap": 4, "apocalypse:spring": 1, "apocalypse:tape": 2}
    noise: medium
    usage: Arme de secours bruyante, chargeur de 6.
  ammo:
    station: workshop
    result: {item: apocalypse:ammo, amount: 8}
    ingredients: {"apocalypse:casings": 8, "apocalypse:propellant": 2, "apocalypse:scrap": 2}
    noise: medium
    usage: Petit lot coûteux de munitions de pistolet.
  bandage:
    station: medical
    result: {item: apocalypse:bandage, amount: 2}
    ingredients: {"apocalypse:cloth": 2, "apocalypse:alcohol": 1}
    usage: Soin modeste ; ne soigne pas une morsure.
  antidote:
    station: medical
    result: {item: apocalypse:antidote}
    ingredients: {"apocalypse:serum": 1, "apocalypse:inhibitor": 1, "apocalypse:syringe": 1}
    usage: Arrête le compte à rebours s'il est terminé à temps.
  barricade:
    station: workbench
    result: {item: apocalypse:barricade, amount: 2}
    ingredients: {"#planks": 4, "minecraft:stick": 2}
    noise: low
    usage: Retarde un groupe d'infectés.
  barricade_reinforced:
    station: workshop
    result: {item: apocalypse:barricade_reinforced}
    ingredients: {"apocalypse:barricade": 1, "apocalypse:scrap": 4, "apocalypse:tape": 1}
    noise: medium
    usage: Résiste bien plus longtemps aux coups.
  decoy:
    station: workshop
    result: {item: apocalypse:decoy}
    ingredients: {"minecraft:redstone": 1, "apocalypse:scrap": 2, "apocalypse:spring": 1}
    usage: "À lancer : sonne quelques secondes et attire les infectés."
  spike_trap:
    station: workbench
    result: {item: apocalypse:spike_trap}
    ingredients: {"#planks": 2, "apocalypse:scrap": 3, "apocalypse:cloth": 1}
    usage: Blesse les infectés qui marchent dessus, charges limitées.
  beacon:
    station: workbench
    result: {item: apocalypse:beacon}
    ingredients: {"apocalypse:scrap": 2, "apocalypse:tape": 1, "minecraft:torch": 1}
    usage: Revendique ta base (rayon 12) ; elle n'est pas assiégée en ton absence.

# Armes de mêlée : dégâts par coup (cœurs = dégâts / 2), cadence, usure (coups), portée (lance), recul.
weapons:
  club: {damage: 5.0, attacks-per-second: 1.2, durability: 60}
  blade: {damage: 4.5, attacks-per-second: 2.0, durability: 40}
  spear: {damage: 5.5, attacks-per-second: 1.0, durability: 70, reach: 4.0}
  heavy_club: {damage: 7.5, attacks-per-second: 0.9, durability: 150, knockback: 0.6}

# Pistolet de fortune : clic droit pour tirer, touche d'échange de main (F) pour recharger.
pistol:
  damage: 8.0
  range: 40
  magazine: 6
  reload-seconds: 2.5
  fire-delay-seconds: 0.45
  durability: 120

# Réparation à l'atelier mécanique de l'arme tenue en main.
repair:
  restore-percent: 50
  melee: {"apocalypse:scrap": 1, "apocalypse:tape": 1}
  pistol: {"apocalypse:scrap": 2, "apocalypse:spring": 1}

# Bruit (portée en blocs) : attire les infectés vers l'endroit du bruit, pas vers ta position actuelle.
noise:
  gunshot: 48
  explosion: 64
  sprint: 10
  glass: 16
  melee: 6
  container: 5
  decoy: 32
  decoy-seconds: 10
  siege: 12
  crafting: 10

# Perception : accroupi, un infecté ne te repère qu'à courte portée ; dans le noir aussi, sauf si tu cours.
perception:
  sneak-detection: 8
  dark-detection: 12
  dark-light-level: 4
  investigate-seconds: 20

traps:
  damage: 6
  charges: 8
