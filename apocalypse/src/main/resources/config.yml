clock:
  checkpoint-seconds: 5

# Largage : chaque nouvelle vie (première entrée ou après une mort) commence n'importe où sur la carte, jamais dans
# le refuge ni près du complexe NEXUS. city-chance = part des largages en ville (le reste : campagne).
spawn:
  city-chance: 0.65
  refuge-margin: 24
  border-margin: 48

# Provisions de départ tirées au hasard : uniquement des objets courants (les objets rares sont refusés ici).
# Avec un peu de chance, de quoi fabriquer une première arme. Rien si la vie précédente a duré moins de
# min-previous-life-minutes (mourir exprès ne sert pas à cumuler des provisions).
start-kit:
  rolls-min: 2
  rolls-max: 4
  loot:
    - {item: minecraft:bread, weight: 20, amount: 2}
    - {item: minecraft:apple, weight: 14, amount: 2}
    - {item: minecraft:carrot, weight: 10, amount: 3}
    - {item: minecraft:cookie, weight: 8, amount: 3}
    - {item: minecraft:dried_kelp, weight: 8, amount: 4}
    - {item: minecraft:torch, weight: 14, amount: 3}
    - {item: apocalypse:cloth, weight: 10}
    - {item: apocalypse:bandage, weight: 5}
    - {item: minecraft:stick, weight: 8, amount: 2}
    - {item: minecraft:string, weight: 5, amount: 2}
    - {item: apocalypse:note, weight: 4}
  weapon-chance: 0.4
  weapon-kits:
    club:
      - {item: minecraft:oak_planks, amount: 2}
      - {item: apocalypse:cloth, amount: 1}
    blade:
      - {item: apocalypse:scrap, amount: 2}
      - {item: apocalypse:tape, amount: 1}
    spear:
      - {item: minecraft:stick, amount: 2}
      - {item: apocalypse:scrap, amount: 1}
      - {item: apocalypse:cloth, amount: 1}
  min-previous-life-minutes: 10

# Fabrication : clic droit sur un établi (workbench), un atelier mécanique (workshop) ou un poste médical (medical).
# Ingrédients : apocalypse:<objet>, minecraft:<objet> ou #planks, #logs, #wool (toutes les essences).
# noise : bruit fait en fabriquant (none, low, medium, high), qui peut attirer les infectés.
recipes:
  club:
    station: workbench
    result: {item: apocalypse:club}
    ingredients: {"#planks": 2, "apocalypse:cloth": 1}
    usage: Première arme bon marché, portée courte.
  blade:
    station: workbench
    result: {item: apocalypse:blade}
    ingredients: {"apocalypse:scrap": 2, "apocalypse:tape": 1}
    usage: Arme rapide mais fragile.
  spear:
    station: workbench
    result: {item: apocalypse:spear}
    ingredients: {"minecraft:stick": 2, "apocalypse:scrap": 1, "apocalypse:cloth": 1}
    usage: Frappe de plus loin, cadence réduite.
  heavy_club:
    station: workbench
    result: {item: apocalypse:heavy_club}
    ingredients: {"apocalypse:club": 1, "apocalypse:scrap": 3, "apocalypse:tape": 1}
    noise: low
    usage: Plus solide, frappe fort et repousse.
  workshop:
    station: workbench
    result: {item: apocalypse:workshop}
    ingredients: {"minecraft:crafting_table": 1, "apocalypse:scrap": 4, "#planks": 2}
    noise: low
    usage: Fabrication et réparation avancées (pistolet, munitions, barricades).
  medical_station:
    station: workbench
    result: {item: apocalypse:medical_station}
    ingredients: {"minecraft:crafting_table": 1, "apocalypse:scrap": 2, "apocalypse:cloth": 2}
    usage: Préparation des bandages et de l'antidote.
  pistol:
    station: workshop
    result: {item: apocalypse:pistol}
    ingredients: {"apocalypse:gun_parts": 2, "apocalypse:scrap": 4, "apocalypse:spring": 1, "apocalypse:tape": 2}
    noise: medium
    usage: Clic droit pour tirer, F pour recharger avec des balles. Répare avant la fin de la barre d’usure.
  auto_turret:
    station: workshop
    result: {item: apocalypse:auto_turret}
    ingredients: {"minecraft:crossbow": 1, "apocalypse:scrap": 6, "apocalypse:spring": 2, "#planks": 4}
    noise: medium
    usage: Infectés à 8 blocs, un tir / 1,25 s, sans munitions. Clic droit main vide pour mettre en pause.
  shotgun:
    station: workshop
    result: {item: apocalypse:shotgun}
    ingredients: {"apocalypse:gun_parts": 3, "apocalypse:scrap": 6, "apocalypse:spring": 2, "apocalypse:tape": 2}
    noise: medium
    usage: Fusil à pompe, gerbe de 8 plombs à courte portée. Une balle par tir, 96 tirs avant réparation.
  smg:
    station: workshop
    result: {item: apocalypse:smg}
    ingredients: {"apocalypse:gun_parts": 4, "apocalypse:scrap": 8, "apocalypse:spring": 3, "apocalypse:tape": 3}
    noise: medium
    usage: Maintiens le clic droit pour tirer en automatique. Une balle par tir.
  rocket_launcher:
    station: workshop
    result: {item: apocalypse:rocket_launcher}
    ingredients: {"apocalypse:gun_parts": 8, "apocalypse:scrap": 16, "apocalypse:propellant": 6, "apocalypse:spring": 4, "apocalypse:tape": 4}
    noise: high
    usage: "Trouvé chargé de 5 à 20 roquettes, rechargeable. Explosion de 6 blocs, sans dégât aux constructions."
  ammo:
    station: workshop
    result: {item: apocalypse:ammo, amount: 12}
    ingredients: {"apocalypse:casings": 8, "apocalypse:propellant": 2, "apocalypse:scrap": 2}
    noise: medium
    usage: Balles pour le pistolet, le fusil à pompe et la mitraillette.
  rocket:
    station: workshop
    result: {item: apocalypse:rocket}
    ingredients: {"apocalypse:propellant": 3, "apocalypse:scrap": 3, "apocalypse:gun_parts": 1}
    noise: medium
    usage: Une roquette pour le lance-roquettes.
  bandage:
    station: medical
    result: {item: apocalypse:bandage, amount: 2}
    ingredients: {"apocalypse:cloth": 2, "apocalypse:alcohol": 1}
    usage: Soin modeste ; ne soigne pas une morsure.
  antidote:
    station: medical
    result: {item: apocalypse:antidote}
    ingredients: {"apocalypse:serum": 1, "apocalypse:inhibitor": 1, "apocalypse:syringe": 1}
    usage: Arrête le compte à rebours s'il est terminé à temps.
  barricade:
    station: workbench
    result: {item: apocalypse:barricade, amount: 2}
    ingredients: {"#planks": 4, "minecraft:stick": 2}
    noise: low
    usage: Retarde un groupe d'infectés.
  barricade_reinforced:
    station: workshop
    result: {item: apocalypse:barricade_reinforced}
    ingredients: {"apocalypse:barricade": 1, "apocalypse:scrap": 4, "apocalypse:tape": 1}
    noise: medium
    usage: Résiste bien plus longtemps aux coups.
  decoy:
    station: workshop
    result: {item: apocalypse:decoy}
    ingredients: {"minecraft:redstone": 1, "apocalypse:scrap": 2, "apocalypse:spring": 1}
    usage: "À lancer : sonne quelques secondes et attire les infectés."
  spike_trap:
    station: workbench
    result: {item: apocalypse:spike_trap}
    ingredients: {"#planks": 2, "apocalypse:scrap": 3, "apocalypse:cloth": 1}
    usage: Blesse les infectés qui marchent dessus, charges limitées.
  beacon:
    station: workbench
    result: {item: apocalypse:beacon}
    ingredients: {"apocalypse:scrap": 2, "apocalypse:tape": 1, "minecraft:torch": 1}
    usage: Revendique ta base (rayon 12) ; elle n'est pas assiégée en ton absence.
  pipe_bomb:
    station: workshop
    result: {item: apocalypse:pipe_bomb}
    ingredients: {"apocalypse:scrap": 2, "apocalypse:propellant": 2, "apocalypse:tape": 1, "minecraft:string": 1}
    noise: medium
    usage: "À lancer : explose 3,5 s plus tard. Dégâts en zone, te blesse aussi, attire tout le quartier."
  molotov:
    station: workbench
    result: {item: apocalypse:molotov}
    ingredients: {"minecraft:glass_bottle": 1, "apocalypse:alcohol": 1, "apocalypse:cloth": 1}
    usage: "À lancer : la bouteille se brise et enflamme une zone quelques secondes."
  fire_axe:
    station: workshop
    result: {item: apocalypse:fire_axe}
    ingredients: {"#planks": 1, "apocalypse:scrap": 4, "apocalypse:tape": 1}
    noise: medium
    usage: Lourde et lente, mais un coup bien placé suffit souvent.
  bow:
    station: workbench
    result: {item: apocalypse:bow}
    ingredients: {"#planks": 2, "minecraft:string": 2, "apocalypse:tape": 1}
    usage: Arme silencieuse ; les flèches se ramassent.
  arrows:
    station: workbench
    result: {item: apocalypse:arrow, amount: 6}
    ingredients: {"minecraft:stick": 3, "apocalypse:scrap": 1, "apocalypse:cloth": 1}
    usage: Flèches pour l'arc de fortune.
  jerrycan:
    station: workshop
    result: {item: apocalypse:jerrycan}
    ingredients: {"apocalypse:scrap": 4, "apocalypse:tape": 1}
    noise: low
    usage: Accroupi + clic droit sur une voiture pour siphonner, clic droit pour faire le plein.

# Armes de mêlée : dégâts par coup (cœurs = dégâts / 2), cadence, usure (coups), portée (lance), recul.
weapons:
  club: {damage: 5.0, attacks-per-second: 1.2, durability: 60}
  blade: {damage: 4.5, attacks-per-second: 2.0, durability: 40}
  spear: {damage: 5.5, attacks-per-second: 1.0, durability: 70, reach: 4.0}
  heavy_club: {damage: 7.5, attacks-per-second: 0.9, durability: 150, knockback: 0.6}
  fire_axe: {damage: 9.0, attacks-per-second: 0.8, durability: 180, knockback: 0.3}

# Pistolet de fortune : clic droit pour tirer, touche d'échange de main (F) pour recharger.
pistol:
  damage: 8.0
  range: 80
  magazine: 6
  reload-seconds: 2.5
  fire-delay-seconds: 0.45
  durability: 120

# Réparation à l'atelier mécanique de l'arme tenue en main.
repair:
  restore-percent: 50
  melee: {"apocalypse:scrap": 1, "apocalypse:tape": 1}
  pistol: {"apocalypse:scrap": 2, "apocalypse:spring": 1}

# Bruit (portée en blocs) : attire les infectés vers l'endroit du bruit, pas vers ta position actuelle.
noise:
  gunshot: 48
  explosion: 64
  sprint: 32
  walk: 8
  block-break: 12
  block-place: 8
  glass: 16
  melee: 6
  container: 5
  decoy: 32
  decoy-seconds: 10
  siege: 12
  crafting: 10

# Perception : accroupi, un infecté ne te repère qu'à courte portée ; dans le noir aussi, sauf si tu cours.
perception:
  sneak-detection: 8
  dark-detection: 12
  dark-light-level: 4
  # Délai depuis la dernière vue ou le dernier bruit : ensuite la recherche et le siège cessent.
  investigate-seconds: 20

traps:
  damage: 6
  charges: 8

# Siège : un infecté bloqué sur le chemin de sa proie frappe l'obstacle (porte, barricade, mur construit). Les dégâts
# par coup viennent de siege-power de l'archétype ; la résistance dépend du matériau. La roche naturelle, les
# conteneurs, le refuge et les bases revendiquées dont tous les membres sont absents ne sont jamais attaqués.
siege:
  enabled: true
  max-blocks-per-second: 8
  max-attackers-per-block: 3
  hit-seconds: 1.0
  blocked-seconds: 2.0
  resistance:
    barricade: 20
    reinforced: 250
    glass: 8
    soft: 15
    wood: 40
    stone: 120
    metal: 250

# Menace : monte seulement quand quelqu'un joue (hors refuge), jamais pendant l'absence ; la mort ne la remet pas à zéro.
# Elle augmente le plafond local d'infectés (max-local-bonus) et la part des infectés spéciaux.
# Cycle de tension : calme, indices, pression, pic (horde), répit. Les facteurs multiplient le plafond local.
threat:
  per-hour: 3
  max-local-bonus: 4
  special-boost-per-level: 0.08
  special-boost-max: 2.5
  cycle-seconds: {calm: 240, signs: 90, pressure: 150, peak: 60, relief: 150}
  cycle-factors: {calm: 0.7, signs: 1.0, pressure: 1.3, peak: 1.5, relief: 0.4}
  horde-min: 3
  horde-max: 8
  night-horde: true

# Faune : un infecté qui mord un animal peut le contaminer ; après une incubation visible, l'animal devient hostile.
fauna:
  enabled: true
  infection-chance: 0.5
  incubation-min-seconds: 30
  incubation-max-seconds: 60
  max-infected: 20
  max-per-ten-minutes: 10
  species: [wolf, cow, sheep, pig]
  # Chevaux sauvages dans les forêts hors de la ville. Un cheval mordu meurt de l'infection.
  horses: true
  # Part des nouveaux infectés qui sont des animaux déjà contaminés (chiens errants en ville, bétail et loups à
  # la campagne), en plus des animaux contaminés par morsure.
  spawn-share: 0.15

# Équipes : taille maximale et durée de validité d'une invitation. Le PvP se règle en jeu (/apocalypse admin pvp on|off),
# désactivé par défaut ; jamais de dégâts entre coéquipiers ni au refuge.
teams:
  max-size: 4
  invite-seconds: 120

# Points d'une vie (les points par infecté sont dans les archétypes) et compétences : coût de chaque rang, effet par rang.
# Endurance : vitesse de déplacement (+3 % par rang) ; mêlée : dégâts (+8 % par rang) ; souffle : respiration sous l'eau.
# Tout est perdu à la mort et ne s'applique qu'à Ground Zero.
progress:
  skill-costs: [150, 300, 600]
  endurance-per-rank: 0.03
  melee-per-rank: 0.08
  breath-per-rank: 1
  contribution-window-seconds: 30

# Introduction (environ 50 s, ignorable avec /apocalypse intro skip) à la première entrée, rejouable depuis le refuge.
intro:
  enabled: true

# Quitter Ground Zero : immédiat au refuge ; ailleurs, après ce délai sans être blessé, sans attaquer ni s'éloigner
# (0 = immédiat partout). Jamais avec une morsure en cours. La vie et la position sont gardées pour le retour.
session:
  leave-seconds: 10

# Voitures abandonnées : clic droit sur une portière pour monter (conducteur, puis passagers), Maj pour descendre.
# Avancer/reculer et tourner avec les touches de déplacement, saut = frein à main, sprint = klaxon. Vitesses en blocs
# par tick (0,75 = 54 km/h), plus lentes hors des routes. Le moteur fait du bruit (attire les infectés), consomme de
# l'essence (litres par bloc) et la voiture s'abîme en percutant murs et infectés. Jerrican : siphonner une autre
# voiture (accroupi + clic droit) puis faire le plein (clic droit). Ferraille en main : réparation.
vehicles:
  enabled: true
  max-speed-road: 0.75
  max-speed-offroad: 0.42
  fuel-per-block: 0.017
  tank-litres: 45
  jerrycan-litres: 20
  engine-noise: 24
  horn-noise: 64
  impact-damage: 30

# Armes de jet. Bombe artisanale : explose après la mèche, dégâts décroissants jusqu'au rayon (moitié moins derrière un
# mur), te blesse aussi ; PvP et coéquipiers suivent les règles habituelles ; aucun bloc détruit. Cocktail Molotov :
# zone en feu pendant quelques secondes (les infectés y brûlent), sans feu posé dans le monde.
explosives:
  pipe-bomb: {fuse-seconds: 3.5, radius: 5.0, damage: 26}
  molotov: {radius: 2.5, seconds: 8, damage-per-second: 2.0}

# Soif : la barre d'expérience devient la jauge d'hydratation (100 = désaltéré). Elle se vide en `minutes` de jeu
# actif (environ trois vagues). Bouteille d'eau +50, eau du robinet en bouteille de verre +35. À sec : lenteur puis dégâts.
thirst:
  enabled: true
  minutes: 35

# Ravitaillement : message radio militaire puis caisse larguée au hasard (carré blanc sur la carte du site), toutes les
# min à max minutes de jeu ; elle disparaît après lifetime-minutes si personne ne l'a ouverte.
supply-drops:
  enabled: true
  min-minutes: 5
  max-minutes: 15
  lifetime-minutes: 10

# Boss : le Némésis arrive à 200 blocs d'un survivant toutes les every-waves vagues (pics de horde et hordes de la nuit).
boss:
  enabled: true
  every-waves: 10

# Survivants à recruter : un appel radio toutes les every-minutes environ ; certains sont déjà mordus (infected-chance).
# Ingénieur (armes), scientifique (antidotes), garde (protège un endroit), explorateur (ramène du matériel).
survivors:
  enabled: true
  every-minutes: 15
  per-player: 4
  infected-chance: 0.4
